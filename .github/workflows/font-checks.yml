name: Font checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  font-checks:
    name: Font checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned font dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify shipped fonts and reproducible source builds
        run: python -B validate.py
      - name: Verify project archives, sources and documentation
        run: python -B tests/check_project.py
      - name: Verify native Windows font intake
        if: runner.os == 'Windows'
        run: python -B native_smoke.py
      - name: Verify checks left tracked files unchanged
        run: git diff --exit-code
