<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1000" role="img" aria-label="Alphecca chart form"><title>Alphecca - heavier chart adaptation</title><desc>Agrippa 1533, II.52, printed p. CXCVII (197). Historical geometry is preserved separately. Left crossed arms widened and five terminal rings enlarged. Both side ticks lengthened to 130 units and separated along the descending right arm.</desc><g fill="none" stroke="currentColor" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"><path d="M236.39980 270.94176 L743.60020 729.05824"/><path d="M236.39980 729.05824 L743.60020 270.94176"/><path d="M858.31341 268.73957 L1411.68659 731.26043"/><path d="M1088.10000 460.80000 L1004.72968 560.54663" data-detail="side-tick"/><path d="M1235.50000 584.00000 L1152.12968 683.74663" data-detail="side-tick"/><circle cx="180" cy="220" r="76" data-terminal="open-ring"/><circle cx="180" cy="780" r="76" data-terminal="open-ring"/><circle cx="800" cy="220" r="76" data-terminal="open-ring"/><circle cx="800" cy="780" r="76" data-terminal="open-ring"/><circle cx="1470" cy="780" r="76" data-terminal="open-ring"/></g></svg>
