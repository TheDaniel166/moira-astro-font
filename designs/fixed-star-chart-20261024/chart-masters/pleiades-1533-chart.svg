<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1000" role="img" aria-label="Pleiades chart form"><title>Pleiades - heavier chart adaptation</title><desc>Agrippa 1533, II.52, printed p. CXCVII (197). Historical geometry is preserved separately. Stepped bowl deepened from 320 to 460 units; three bars spaced 170 units apart. Open-top construction, three rings and one upward foot retained.</desc><g fill="none" stroke="currentColor" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"><path d="M216.00000 280.00000 L774.00000 280.00000"/><path d="M850.00000 356.00000 L850.00000 740.00000"/><path d="M850.00000 740.00000 L1440.00000 740.00000"/><path d="M1440.00000 740.00000 L1440.00000 356.00000"/><circle cx="140" cy="280" r="76" data-terminal="open-ring"/><circle cx="850" cy="280" r="76" data-terminal="open-ring"/><circle cx="1440" cy="280" r="76" data-terminal="open-ring"/></g><path d="M300 164 H380 L362 280 L380 396 H300 L318 280 Z" fill="currentColor" data-detail="hourglass-bar"/><path d="M470 164 H550 L532 280 L550 396 H470 L488 280 Z" fill="currentColor" data-detail="hourglass-bar"/><path d="M640 164 H720 L702 280 L720 396 H640 L658 280 Z" fill="currentColor" data-detail="hourglass-bar"/><path d="M1123 740 H1167 L1183 620 H1107 Z" fill="currentColor" data-detail="short-foot"/></svg>
