<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 1000" role="img" aria-label="Sirius chart form"><title>Sirius - heavier chart adaptation</title><desc>Agrippa 1533, II.52, printed p. CXCVII (197). Historical geometry is preserved separately. Crossed diamond and three bars widened to preserve separation after thickening. C terminal enlarged and its stem stopped at the outer join to keep the opening clear; four rings and three bars retained.</desc><g fill="none" stroke="currentColor" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"><path d="M181.09758 283.92956 L458.90242 716.07044"/><path d="M458.90242 283.92956 L181.09758 716.07044"/><path d="M559.99077 266.65949 L860.00000 500.00000"/><path d="M559.99077 733.34051 L860.00000 500.00000"/><path d="M860.00000 500.00000 L1620.00000 500.00000"/><circle cx="140" cy="220" r="76" data-terminal="open-ring"/><circle cx="140" cy="780" r="76" data-terminal="open-ring"/><circle cx="500" cy="220" r="76" data-terminal="open-ring"/><circle cx="500" cy="780" r="76" data-terminal="open-ring"/></g><path d="M1050 384 H1130 L1112 500 L1130 616 H1050 L1068 500 Z" fill="currentColor" data-detail="hourglass-bar"/><path d="M1220 384 H1300 L1282 500 L1300 616 H1220 L1238 500 Z" fill="currentColor" data-detail="hourglass-bar"/><path d="M1390 384 H1470 L1452 500 L1470 616 H1390 L1408 500 Z" fill="currentColor" data-detail="hourglass-bar"/><g fill="none" stroke="currentColor" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"><path d="M1800 396.076952 A120 120 0 1 0 1800 603.923048"/></g></svg>
