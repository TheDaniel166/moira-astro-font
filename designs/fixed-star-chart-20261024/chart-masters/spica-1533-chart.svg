<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 1000" role="img" aria-label="Spica chart form"><title>Spica - heavier chart adaptation</title><desc>Agrippa 1533, II.52, printed p. CXCVII (197). Historical geometry is preserved separately. Opposed curves spread apart and terminal ring enlarged. Second curve remains opposed; it is not changed into the Crow-wing structure.</desc><g fill="none" stroke="currentColor" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"><path d="M332.99488 500.00000 L1724.00000 500.00000"/><path d="M191.97953 305.44483 C380 400 380 600 191.97953 694.55517"/><path d="M798.02047 305.44483 C580 400 580 600 798.02047 694.55517"/><circle cx="140" cy="250" r="76" data-terminal="open-ring"/><circle cx="140" cy="750" r="76" data-terminal="open-ring"/><circle cx="850" cy="250" r="76" data-terminal="open-ring"/><circle cx="850" cy="750" r="76" data-terminal="open-ring"/><circle cx="1800" cy="500" r="76" data-terminal="open-ring"/></g></svg>
